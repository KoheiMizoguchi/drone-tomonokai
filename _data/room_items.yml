# ▼ 楽天ROOMで紹介するアイテムの一覧 ▼
# ここに書いたアイテムが「おすすめアイテム」ページ（/items/）に並び、
# コラム記事の中にもカードとして埋め込めます。
#
# 【追加のしかた】下の例の「#」を外して、1アイテムごとに書き足してください。
#   id        … 英数字とハイフンの識別名。記事に埋め込むときに使う（重複不可）
#   name      … 商品名（短く分かりやすく）
#   url       … 楽天ROOMの商品ページのURL（ROOMアプリの「シェア」→「リンクをコピー」で取得）
#   image     … 商品画像のURL（任意。楽天の商品画像URLか、assets/img/room/ に置いた画像のパス）
#   category  … 分類。おすすめページの見出しになる（例：機体 ／ バッテリー・充電 ／ 練習用品 ／ 収納・持ち運び）
#   comment   … おすすめする理由（1〜2文。実際に使った感想だと信頼されます）
#   featured  … true にすると、トップページの「おすすめアイテム」欄に優先して出ます（最大4件。任意）
#
# 【記事への埋め込み】記事の本文中に次の1行を書くと、その位置に商品カードが出ます。
#   {% include room-item.html id="landing-pad" %}
#
# 例：
# - id: landing-pad
#   name: 折りたたみ式ヘリパッド（75cm）
#   url: https://room.rakuten.co.jp/room_xxxxxxxxxx/1700000000000000
#   image: https://thumbnail.image.rakuten.co.jp/xxxxx.jpg
#   category: 練習用品
#   comment: 芝生や砂地でも離着陸が安定します。プロペラが小石を巻き上げるのも防げます。
#
# - id: spare-battery
#   name: 予備バッテリー
#   url: https://room.rakuten.co.jp/room_xxxxxxxxxx/1700000000000001
#   category: バッテリー・充電
#   comment: 1本の飛行時間は思ったより短いので、練習するなら最低2本あると安心です。
