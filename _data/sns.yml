# ▼ SNSアカウントの一覧 ▼
# URLを入れたSNSが、トップページの「SNSでも発信中」・フッター・各コラムの最後に表示されます。
# url が空のSNSは表示されません（LINEだけは空でも _config.yml の line_url が使われます）。
# LINE以外のSNSが1つもURL入りでないうちは、SNS欄そのものが表示されません。
#
#   name   … SNSの名前（アイコンが自動で付きます。表示順はこのファイルの順）
#   url    … プロフィールページのURL（例：https://x.com/アカウント名）
#   handle … アカウント名（例："@drone_tomonokai"。@ で始めるときは " " で囲む）
#   text   … そのSNSで何を発信しているか（1文）

