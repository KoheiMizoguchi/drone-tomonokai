<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.note{position:absolute;right:48px;bottom:26px;font-weight:700;font-size:25px;color:#444}
svg text{font-family:"Zen Kaku Gothic New",sans-serif}
.cards{position:absolute;left:48px;right:48px;top:150px;display:flex;gap:44px}
.card{flex:1;background:#fff;border-radius:22px;padding:26px 22px;height:420px;box-sizing:border-box;position:relative}
.step{display:inline-block;background:#000;color:#fff;font-weight:900;font-size:27px;padding:6px 18px;border-radius:999px}
.ic{width:84px;height:84px;border-radius:50%;background:#FFF3EC;display:grid;place-items:center;position:absolute;right:24px;top:22px}
.ic svg{width:46px;height:46px}
.app{margin-top:36px;font-weight:900;font-size:33px;line-height:1.35;min-height:80px}
ul{margin:18px 0 0;padding:0;list-style:none;border-top:3px solid #000}
li{font-weight:700;font-size:28px;padding:10px 0 10px 22px;border-bottom:1px solid #ddd;position:relative}
li::before{content:"";position:absolute;left:2px;top:27px;width:10px;height:10px;border-radius:50%;background:#FF4F00}
.arr{position:absolute;top:342px;width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-left:24px solid #FF4F00}
</style></head><body>
<div class="c">
  <div class="ttl">飛ばす日の確認の流れ</div>
  <div class="cards">
    <div class="card"><span class="step">前日</span><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7" stroke="#FF4F00"/></svg></div><div class="app">Windy</div><ul><li>地上と上空の風</li><li>突風の予報</li><li>飛ばす時間を決める</li></ul></div>
    <div class="card"><span class="step">当日の出発前</span><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1-.5-8 5 5 0 0 1 9.6 1.4A3.5 3.5 0 0 1 17 15H7Z"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2" stroke="#FF4F00"/></svg></div><div class="app">Windy＋気象庁<br>「雨雲の動き」</div><ul><li>予報の変化</li><li>雨雲と雷</li></ul></div>
    <div class="card"><span class="step">飛ばす直前</span><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3" fill="#FF4F00" stroke="none"/></svg></div><div class="app">風速計＋<br>Flightradar24</div><ul><li>今の風を測る</li><li>近くの飛行機・ヘリ</li><li>空を見て、音を聞く</li></ul></div>
  </div>
  <div class="arr" style="left:397px"></div><div class="arr" style="left:779px"></div>
  <div class="note">迷ったら、飛ばさない</div>
</div></body></html>
