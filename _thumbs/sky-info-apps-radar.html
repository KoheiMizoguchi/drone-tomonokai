<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.note{position:absolute;right:48px;bottom:26px;font-weight:700;font-size:25px;color:#444}
svg text{font-family:"Zen Kaku Gothic New",sans-serif}
</style></head><body>
<div class="c">
  <div class="ttl">飛行機の位置が、地図に出るしくみ</div>
  <svg width="1200" height="675" style="position:absolute;inset:0">
    <!-- 地面 -->
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#000" stroke-width="4"/>
    <!-- ① 飛行機と電波 -->
    <g transform="translate(150 175) scale(4.2)" fill="#000"><path d="M21 15.5v-1.8l-8-5V4a1.5 1.5 0 0 0-3 0v4.7l-8 5v1.8l8-2.5v4.6l-2 1.5V21l3.5-1 3.5 1v-1.4l-2-1.5V13l8 2.5Z"/></g>
    <g transform="translate(200 290) rotate(75)" stroke="#FF4F00" stroke-width="5" stroke-linecap="round" fill="none"><path d="M30 -18a36 36 0 0 1 0 36"/><path d="M52 -32a62 62 0 0 1 0 64"/><path d="M74 -46a88 88 0 0 1 0 92"/></g>
    <text x="300" y="215" font-size="28" font-weight="900">① 飛行機が、位置などを</text>
    <text x="300" y="252" font-size="28" font-weight="900">電波で発信</text>
    <!-- ② 受信機 -->
    <g transform="translate(240 560)" stroke="#000" stroke-width="5" stroke-linecap="round" fill="none"><path d="M0 0V-70"/><path d="M-26 0L0 -50L26 0"/><circle cx="0" cy="-78" r="9" fill="#FF4F00" stroke="none"/><path d="M-22 -96a30 30 0 0 1 44 0" stroke-width="4"/></g>
    <text x="160" y="610" font-size="28" font-weight="900">② 地上の受信機</text>
    <!-- ③ Flightradar24 -->
    <path d="M300 470H440" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    <path d="M424 456L442 470L424 484" stroke="#000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="456" y="420" width="250" height="100" rx="18" fill="#000"/>
    <text x="581" y="466" text-anchor="middle" font-size="27" font-weight="900" fill="#fff">③ Flightradar24</text>
    <text x="581" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">情報を集めて地図に</text>
    <path d="M720 470H800" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    <path d="M784 456L802 470L784 484" stroke="#000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ④ スマホ -->
    <rect x="816" y="370" width="110" height="190" rx="16" fill="#fff" stroke="#000" stroke-width="5"/>
    <rect x="830" y="392" width="82" height="140" rx="4" fill="#FFE1D1"/>
    <g transform="translate(846 420) scale(1.5)" fill="#FF4F00"><path d="M21 15.5v-1.8l-8-5V4a1.5 1.5 0 0 0-3 0v4.7l-8 5v1.8l8-2.5v4.6l-2 1.5V21l3.5-1 3.5 1v-1.4l-2-1.5V13l8 2.5Z"/></g>
    <circle cx="890" cy="500" r="5" fill="#000"/>
    <text x="871" y="610" text-anchor="middle" font-size="28" font-weight="900">④ スマホの地図</text>
    <!-- 映らないことがある：山の陰の低いヘリ -->
    <path d="M940 560L1030 360L1120 560Z" fill="#2E7D4F"/>
    <path d="M1128 488L1020 452" stroke="#FF4F00" stroke-width="4" stroke-dasharray="6 9" stroke-linecap="round"/>
    <g stroke="#C73C00" stroke-width="6" stroke-linecap="round"><path d="M998 432l26 26M1024 432l-26 26"/></g>
    <g transform="translate(1150 500) scale(.8)" stroke="#000" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M-34 -22H34"/><path d="M0 -22V-10"/>
      <ellipse cx="0" cy="2" rx="22" ry="14" fill="#000"/><path d="M20 2H54"/><path d="M54 -8V10"/>
      <path d="M-14 22H16" />
    </g>
    <text x="1180" y="190" text-anchor="end" font-size="25" font-weight="900" fill="#C73C00">低い高度や山の陰の機体は、</text>
    <text x="1180" y="226" text-anchor="end" font-size="25" font-weight="900" fill="#C73C00">電波が届きにくく</text>
    <text x="1180" y="262" text-anchor="end" font-size="25" font-weight="900" fill="#C73C00">映らないことがある</text>
  </svg>
  <div class="note"></div>
</div></body></html>
